<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Painel de Assinatura - Mobile PDF Guru</title>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .signature-line {
            background-image: linear-gradient(to right, #c1c6d6 33%, rgba(255, 255, 255, 0) 0%);
            background-position: bottom;
            background-size: 12px 1px;
            background-repeat: repeat-x;
        }
        .glass-panel {
            background: rgba(248, 250, 251, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background font-body text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Anchor (Shared Component: TopAppBar) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 py-4 w-full bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur-xl shadow-sm shadow-slate-900/5">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-slate-200/50 transition-colors">
<span class="material-symbols-outlined text-blue-700">arrow_back</span>
</button>
<h1 class="text-xl font-extrabold tracking-tight text-blue-700 font-headline">Criar Assinatura</h1>
</div>
<button class="p-2 rounded-full hover:bg-slate-200/50 transition-colors">
<span class="material-symbols-outlined text-slate-500">more_vert</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-grow pt-24 pb-32 px-4 md:px-8 max-w-4xl mx-auto w-full">
<!-- Mode Selector Chips (Intentional Asymmetry) -->
<div class="flex gap-3 mb-8 overflow-x-auto pb-2 scrollbar-hide">
<button class="flex items-center gap-2 px-6 py-2.5 rounded-full bg-secondary-container text-primary font-semibold text-sm transition-all shadow-sm">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">edit</span>
<span>Desenhar</span>
</button>
<button class="flex items-center gap-2 px-6 py-2.5 rounded-full bg-surface-container-high text-on-surface-variant font-medium text-sm hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined text-lg">keyboard</span>
<span>Digitar</span>
</button>
<button class="flex items-center gap-2 px-6 py-2.5 rounded-full bg-surface-container-high text-on-surface-variant font-medium text-sm hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined text-lg">image</span>
<span>Importar</span>
</button>
</div>
<!-- Signature Workspace (The Digital Curator Hero) -->
<div class="relative group">
<div class="w-full aspect-[3/2] bg-surface-container-lowest rounded-[2rem] shadow-sm border border-outline-variant/15 flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Decorative Element -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none flex items-center justify-center">
<span class="material-symbols-outlined text-[20rem]">gesture</span>
</div>
<!-- Signature Area -->
<div class="w-full h-full flex flex-col items-center justify-center p-8 z-10">
<div class="w-full h-full relative signature-line flex items-center justify-center">
<!-- Placeholder/Instruction -->
<p class="text-outline font-label text-sm uppercase tracking-[0.2em] mb-4">Assine aqui</p>
</div>
</div>
<!-- Floating Toolbar (Internal to Pad) -->
<div class="absolute top-6 right-6 flex flex-col gap-3">
<button class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center hover:bg-error-container hover:text-error transition-all" title="Limpar">
<span class="material-symbols-outlined text-[20px]">delete_sweep</span>
</button>
</div>
</div>
<!-- Metadata Insight (Editorial Contrast) -->
<div class="mt-4 flex justify-between items-center px-2">
<span class="text-outline font-label text-[11px] uppercase tracking-widest">Resolução: Vector (SVG)</span>
<span class="text-outline font-label text-[11px] uppercase tracking-widest">Processamento Criptografado</span>
</div>
</div>
<!-- Tooling Section -->
<section class="mt-10 grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Color Selection Layer -->
<div class="bg-surface-container-low p-6 rounded-2xl flex flex-col gap-4">
<h3 class="font-headline font-bold text-sm text-on-surface uppercase tracking-wider">Cor da Tinta</h3>
<div class="flex items-center gap-6">
<button class="w-10 h-10 rounded-full bg-[#000000] ring-4 ring-primary-fixed ring-offset-2 flex items-center justify-center text-white">
<span class="material-symbols-outlined text-sm">check</span>
</button>
<button class="w-10 h-10 rounded-full bg-[#004493] hover:scale-110 transition-transform"></button>
<button class="w-10 h-10 rounded-full bg-[#ba1a1a] hover:scale-110 transition-transform"></button>
</div>
</div>
<!-- Preview/History Card (Asymmetric Layout) -->
<div class="bg-surface-container-low p-6 rounded-2xl flex flex-col justify-between">
<div>
<h3 class="font-headline font-bold text-sm text-on-surface uppercase tracking-wider mb-1">Última Assinatura</h3>
<p class="text-outline font-label text-xs">Salva em 24 Out, 2023</p>
</div>
<div class="h-12 w-full flex items-center justify-start opacity-40">
<div class="font-signature-1 text-2xl text-on-surface-variant">John Hancock</div>
</div>
</div>
</section>
<!-- Signature Options: Typography Mode (Hidden by default in actual app logic, but shown here for UI variety) -->
<div class="mt-8 bg-surface-container-lowest border border-outline-variant/10 rounded-3xl p-6 hidden">
<h3 class="font-headline font-bold text-sm text-on-surface uppercase tracking-wider mb-4">Selecione o Estilo</h3>
<div class="grid grid-cols-1 gap-4">
<div class="p-6 rounded-xl bg-surface-container-low flex items-center justify-between border-r-4 border-blue-600">
<span class="font-signature-1 text-3xl">Signature One</span>
<span class="material-symbols-outlined text-blue-700">radio_button_checked</span>
</div>
<div class="p-6 rounded-xl bg-surface hover:bg-surface-container-high transition-colors flex items-center justify-between">
<span class="font-signature-2 text-3xl">Signature Two</span>
<span class="material-symbols-outlined text-outline">radio_button_unchecked</span>
</div>
</div>
</div>
</main>
<!-- Bottom Action Bar (The Anchor) -->
<div class="fixed bottom-0 left-0 w-full glass-panel px-6 pb-10 pt-6 flex gap-4 items-center justify-center z-50">
<button class="flex-1 py-4 px-6 rounded-xl font-label font-bold text-sm uppercase tracking-widest text-primary border border-primary/20 hover:bg-primary/5 transition-all">
            Cancelar
        </button>
<button class="flex-[2] py-4 px-6 rounded-xl bg-gradient-to-br from-primary to-primary-container text-white font-label font-bold text-sm uppercase tracking-widest shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all">
            Salvar Assinatura
        </button>
</div>
<!-- Navigation Overlay (Shared Component: BottomNavBar - Contextual Suppression) -->
<!-- The navigation is suppressed as this is a focused task-flow for "Creating Signature" -->
<!-- Floating Preview Card (Contextual Element) -->
<div class="fixed top-24 right-6 hidden md:block w-48 p-4 rounded-2xl bg-surface-container-lowest shadow-2xl border border-outline-variant/10">
<div class="w-full h-24 rounded-lg bg-surface-container-high flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover opacity-20 grayscale" data-alt="Close-up of a high-quality textured paper background with subtle fiber details for document previewing" src="https://lh3.googleusercontent.com/aida-public/AB6AXuApbdcAvkmlsEuYqOkKf1-H-iDS4ZYyrBLiunAUwLUqTETuOzht0Ffpr94Hq2I3YvgCH3kVKbF4HbQbxauRMqAVcbURMn3Auvo6IJIpsj-UqbTPd-G7x3-TvCAKr9vsq4kzHgNWLR8sCS_15FFqGsPtqaTq46EENXT1jYKmjXpzhnnGO3bjLF5O5bK87tokWOgN_xWDyf0w3aVfDqiOEhfyBkmSr0wIvZPDeQas74EWSKaIImoIntuvwLtG6Aw-Z27hXEXxbnySNblG"/>
<div class="absolute inset-0 flex items-center justify-center">
<span class="text-[10px] text-outline text-center px-4 font-label leading-tight">PRE-VISUALIZAÇÃO EM DOCUMENTO</span>
</div>
</div>
</div>
</body></html>
